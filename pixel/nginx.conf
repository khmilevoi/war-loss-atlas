server {
    listen 8080;
    server_name _;
    root /srv/pixel-atlas;
    absolute_redirect off;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    location = /health {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location = / {
        return 302 /ru/;
    }

    location = /ru {
        return 308 /ru/;
    }

    location = /en {
        return 308 /en/;
    }

    location ~ ^/(ru|en)/(?:index\.html)?$ {
        add_header Cache-Control "no-cache" always;
        try_files /$1/index.html =404;
    }

    location ~ "^/assets/[a-zA-Z0-9_-]+-[a-zA-Z0-9_-]{8,}\.(?:css|js|json|png|svg|webp|woff2)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~ ^/licenses/(?:ATTRIBUTION\.md|CC-BY-4\.0\.txt|HISTORICAL-FACTS\.md|NATURAL-EARTH\.txt)$ {
        default_type text/plain;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
